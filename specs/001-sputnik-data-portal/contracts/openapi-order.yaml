openapi: 3.1.0
info:
  title: Спутник Данные — Order Service API
  description: |
    Заказы и подписки покупателей маркетплейса данных.
    Часть учебного демо-портала «Спутник Данные» (проект ДДЕ).
  version: 1.0.0
  x-service: order-service
servers:
  - url: http://localhost:8003/api/v1
    description: Локальный запуск (профиль base/adv)
security:
  - bearerAuth: []
tags:
  - name: orders
    description: Заказы на покупку датасетов
  - name: subscriptions
    description: Подписки на потоки данных
paths:
  /orders/{orderId}/pay:
    post:
      tags: [orders]
      summary: Оплатить заказ (ORDER_PENDING → ORDER_PAID)
      operationId: payOrder
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Заказ оплачен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /orders/fulfill:
    post:
      tags: [orders]
      summary: Отметить выдачу данных (ORDER_PAID → ORDER_FULFILLED)
      operationId: fulfillOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FulfillOrderRequest'
      responses:
        '200':
          description: Заказ исполнен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /orders/access:
    get:
      tags: [orders]
      summary: Проверить право скачивания датасета (для delivery)
      operationId: getOrderAccess
      parameters:
        - $ref: '#/components/parameters/DatasetIdQuery'
      responses:
        '200':
          description: Право доступа к выгрузке
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderAccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /orders:
    post:
      tags: [orders]
      summary: Создать заказ (покупка датасета)
      operationId: createOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: Заказ создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags: [orders]
      summary: Список заказов текущего покупателя
      operationId: listOrders
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /subscriptions:
    get:
      tags: [subscriptions]
      summary: Подписки текущего покупателя
      operationId: listSubscriptions
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [subscriptions]
      summary: Оформить подписку на поток данных
      operationId: createSubscription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSubscriptionRequest'
      responses:
        '201':
          description: Подписка создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /subscriptions/{subscriptionId}:
    get:
      tags: [subscriptions]
      summary: Подписка по идентификатору (для delivery)
      operationId: getSubscription
      parameters:
        - $ref: '#/components/parameters/SubscriptionId'
      responses:
        '200':
          description: Подписка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-Api-Key
  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    OrderId:
      name: orderId
      in: path
      required: true
      description: Идентификатор заказа (od_*)
      schema:
        type: string
        example: od_7a1b
    SubscriptionId:
      name: subscriptionId
      in: path
      required: true
      description: Идентификатор подписки (sub_*)
      schema:
        type: string
        example: sub_7a1b
    DatasetIdQuery:
      name: datasetId
      in: query
      required: true
      description: Идентификатор продукта (ds_*)
      schema:
        type: string
        pattern: '^ds_[a-z0-9_-]+$'
        example: ds_weather-stations
  schemas:
    CreateOrderRequest:
      type: object
      required: [datasetId]
      properties:
        datasetId:
          type: string
          pattern: '^ds_[a-z0-9_-]+$'
          example: ds_weather-stations
        quantity:
          type: integer
          minimum: 1
          default: 1
    CreateSubscriptionRequest:
      type: object
      required: [datasetId, intervalSec]
      properties:
        datasetId:
          type: string
          pattern: '^ds_[a-z0-9_-]+$'
          example: ds_air-quality
        intervalSec:
          type: integer
          minimum: 60
          maximum: 86400
          example: 300
    FulfillOrderRequest:
      type: object
      required: [datasetId]
      properties:
        datasetId:
          type: string
          pattern: '^ds_[a-z0-9_-]+$'
          example: ds_weather-stations
    OrderAccess:
      type: object
      required: [datasetId, hasAccess]
      properties:
        datasetId:
          type: string
          example: ds_weather-stations
        hasAccess:
          type: boolean
          example: true
    Order:
      type: object
      required: [orderId, userId, datasetId, status, createdAt]
      properties:
        orderId:
          type: string
          example: od_7a1b
        userId:
          type: string
          example: us_42
        datasetId:
          type: string
          example: ds_weather-stations
        status:
          $ref: '#/components/schemas/OrderStatus'
        amount:
          type: number
          format: double
          example: 1200.0
        createdAt:
          type: string
          format: date-time
    Subscription:
      type: object
      required: [subscriptionId, userId, datasetId, intervalSec, status, startedAt]
      properties:
        subscriptionId:
          type: string
          example: sub_7a1b
        userId:
          type: string
          example: us_42
        datasetId:
          type: string
          example: ds_air-quality
        intervalSec:
          type: integer
          example: 300
        status:
          $ref: '#/components/schemas/SubscriptionStatus'
        startedAt:
          type: string
          format: date-time
    OrderStatus:
      type: string
      enum: [ORDER_PENDING, ORDER_PAID, ORDER_FULFILLED, ORDER_CANCELLED]
    SubscriptionStatus:
      type: string
      enum: [SUB_ACTIVE, SUB_PAUSED, SUB_CANCELLED]
    PagedResponse:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            oneOf:
              - $ref: '#/components/schemas/Order'
              - $ref: '#/components/schemas/Subscription'
        pagination:
          $ref: '#/components/schemas/Pagination'
    Pagination:
      type: object
      required: [page, pageSize, total, totalPages, hasMore]
      properties:
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }
        totalPages: { type: integer }
        hasMore: { type: boolean }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: VALIDATION_ERROR
            message:
              type: string
            details:
              type: array
              items:
                type: object
                properties:
                  field: { type: string }
                  message: { type: string }
                  code: { type: string }
            requestId:
              type: string
              example: req_abc123
  responses:
    BadRequest:
      description: Ошибка валидации или некорректный запрос
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Отсутствует или невалидная аутентификация
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Ресурс принадлежит другому покупателю
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Ресурс не найден
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Конфликт состояния (дубль, несовместимое состояние)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RateLimited:
      description: Rate limit exceeded — превышен лимит запросов (RATE_LIMITED)
      headers:
        Retry-After:
          description: Секунды до повторной попытки
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: Непредвиденная ошибка сервера
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'