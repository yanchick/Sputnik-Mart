[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sputnik-sim"
version = "0.1.0"
description = "Спутник Данные — пакет sim"
requires-python = ">=3.12,<3.13"
dependencies = [
  "sputnik-contracts",
  "sputnik-config",
  "sputnik-observability",
  "sputnik-db",
]

[tool.uv.sources]
sputnik-contracts = { workspace = true }
sputnik-config = { workspace = true }
sputnik-observability = { workspace = true }
sputnik-db = { workspace = true }

[project.scripts]
sim = "sim.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sim"]
