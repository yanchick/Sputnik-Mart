[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sputnik-web-vitrina"
version = "0.1.0"
description = "Спутник Данные — пакет web-vitrina"
requires-python = ">=3.12,<3.13"
dependencies = [
  "sputnik-contracts",
  "sputnik-config",
  "sputnik-observability",
  "sputnik-panel-shared",
  "panel>=1.4",
  "bokeh>=3.4",
  "pandas>=2.0",
  "httpx>=0.27",
  "httpx-sse>=0.4",
]

[tool.uv.sources]
sputnik-contracts = { workspace = true }
sputnik-config = { workspace = true }
sputnik-observability = { workspace = true }
sputnik-panel-shared = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/web_vitrina"]
