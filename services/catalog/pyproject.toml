[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sputnik-catalog"
version = "0.1.0"
description = "Спутник Данные — пакет catalog"
requires-python = ">=3.12,<3.13"
dependencies = [
  "sputnik-contracts",
  "sputnik-config",
  "sputnik-observability",
  "sputnik-db",
  "sputnik-service-client",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "pyarrow>=17.0",
]

[tool.uv.sources]
sputnik-contracts = { workspace = true }
sputnik-config = { workspace = true }
sputnik-observability = { workspace = true }
sputnik-db = { workspace = true }
sputnik-service-client = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/catalog"]
