[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sputnik-config"
version = "0.1.0"
description = "Спутник Данные — пакет config"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/config"]
