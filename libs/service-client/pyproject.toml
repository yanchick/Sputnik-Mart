[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sputnik-service-client"
version = "0.1.0"
description = "Спутник Данные — клиент внутренних HTTP-вызовов между сервисами"
requires-python = ">=3.12,<3.13"
dependencies = [
  "sputnik-observability",
  "httpx>=0.27",
]

[tool.uv.sources]
sputnik-observability = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/service_client"]
