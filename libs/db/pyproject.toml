[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sputnik-db"
version = "0.1.0"
description = "Спутник Данные — пакет db"
requires-python = ">=3.12,<3.13"
dependencies = [
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "redis>=5.0",
  "aiokafka>=0.10",
  "clickhouse-connect>=0.7",
  "motor>=3.4",
  "boto3>=1.34",
  "alembic>=1.13",
]

[tool.hatch.build.targets.wheel]
packages = ["src/db"]
