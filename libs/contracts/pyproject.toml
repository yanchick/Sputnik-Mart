[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sputnik-contracts"
version = "0.1.0"
description = "Спутник Данные — пакет contracts"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic>=2.7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/contracts"]
