[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sputnik-observability"
version = "0.1.0"
description = "Спутник Данные — пакет observability"
requires-python = ">=3.12,<3.13"
dependencies = [
  "structlog>=24.1",
  "prometheus-client>=0.20",
  "opentelemetry-api>=1.25",
  "fastapi>=0.115",
]

[tool.hatch.build.targets.wheel]
packages = ["src/observability"]
