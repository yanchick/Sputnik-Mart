openapi: 3.1.0
info:
  title: Спутник Данные — Catalog Service API
  description: |
    Каталог продуктов маркетплейса данных: датасеты, карточки, схемы, образцы.
    Часть учебного демо-портала «Спутник Данные» (проект ДДЕ).
  version: 1.0.0
  x-service: catalog-service
servers:
  - url: http://localhost:8001/api/v1
    description: Локальный запуск (профиль base/adv)
security:
  - bearerAuth: []
tags:
  - name: datasets
    description: Продукты (датасеты и потоки) в каталоге
paths:
  /datasets:
    get:
      tags: [datasets]
      summary: Список продуктов каталога
      operationId: listDatasets
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: category
          in: query
          description: Фильтр по категории
          schema:
            $ref: '#/components/schemas/DatasetCategory'
        - name: minQuality
          in: query
          description: Минимальный рейтинг качества (0..1)
          schema:
            type: number
            format: double
            minimum: 0
            maximum: 1
        - name: sortBy
          in: query
          schema:
            type: string
            enum: [createdAt, lastUpdatedAt, pricePerUnit, qualityScore]
            default: createdAt
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /datasets/{datasetId}:
    get:
      tags: [datasets]
      summary: Карточка продукта
      operationId: getDataset
      parameters:
        - $ref: '#/components/parameters/DatasetId'
      responses:
        '200':
          description: Карточка продукта
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dataset'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /datasets/{datasetId}/schema:
    get:
      tags: [datasets]
      summary: Схема (поля) продукта
      operationId: getDatasetSchema
      parameters:
        - $ref: '#/components/parameters/DatasetId'
      responses:
        '200':
          description: Описание полей
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SchemaField'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /datasets/{datasetId}/sample:
    get:
      tags: [datasets]
      summary: Образец данных продукта
      operationId: getDatasetSample
      parameters:
        - $ref: '#/components/parameters/DatasetId'
        - name: format
          in: query
          description: Формат образца
          schema:
            $ref: '#/components/schemas/FileFormat'
            default: CSV
      responses:
        '200':
          description: Образец (CSV/JSON/Parquet)
          content:
            text/csv:
              schema:
                type: string
            application/json:
              schema:
                type: array
                items:
                  type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    DatasetId:
      name: datasetId
      in: path
      required: true
      description: Идентификатор продукта (ds_*)
      schema:
        type: string
        pattern: '^ds_[a-z0-9_-]+$'
        example: ds_weather-stations
    Page:
      name: page
      in: query
      description: Номер страницы
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      description: Размер страницы
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  schemas:
    Dataset:
      type: object
      required: [datasetId, providerId, name, category, qualityScore, lastUpdatedAt, licence]
      properties:
        datasetId:
          type: string
          example: ds_weather-stations
        providerId:
          type: string
          example: pv_metro
        name:
          type: string
          example: Метеостанции города
        category:
          $ref: '#/components/schemas/DatasetCategory'
        frequencySec:
          type: integer
          description: Период обновления потока, сек
          example: 60
        volumeEstimate:
          type: string
          example: 1.2M rows/month
        pricePerUnit:
          type: number
          format: double
          example: 1200.0
        qualityScore:
          type: number
          format: double
          minimum: 0
          maximum: 1
          example: 0.92
        lastUpdatedAt:
          type: string
          format: date-time
          example: '2026-09-07T12:00:00Z'
        licence:
          type: string
          example: sputnik_edu_v1
    SchemaField:
      type: object
      required: [name, type]
      properties:
        name:
          type: string
          example: temperature
        type:
          type: string
          enum: [STRING, INT, DOUBLE, BOOLEAN, DATETIME, GEO]
          example: DOUBLE
        unit:
          type: string
          example: C
        nullable:
          type: boolean
          default: true
    DatasetCategory:
      type: string
      enum: [WEATHER, AIR_QUALITY, ENERGY, TRANSPORT, COMMERCE]
      example: WEATHER
    FileFormat:
      type: string
      enum: [CSV, JSON, PARQUET]
    PagedResponse:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Dataset'
        pagination:
          $ref: '#/components/schemas/Pagination'
    Pagination:
      type: object
      required: [page, pageSize, totalItems, totalPages]
      properties:
        page: { type: integer }
        pageSize: { type: integer }
        totalItems: { type: integer }
        totalPages: { type: integer }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: VALIDATION_ERROR
            message:
              type: string
            details:
              type: array
              items:
                $ref: '#/components/schemas/ErrorDetail'
            requestId:
              type: string
              example: req_abc123
    ErrorDetail:
      type: object
      properties:
        field:
          type: string
          example: email
        message:
          type: string
        code:
          type: string
          example: INVALID_FORMAT
  responses:
    BadRequest:
      description: Ошибка валидации или некорректный запрос
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Отсутствует или невалидная аутентификация
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Ресурс не найден
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: Непредвиденная ошибка сервера
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'